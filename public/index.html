<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopee Video Downloader HD - Tanpa Watermark</title>
  <meta name="description" content="Download video Shopee Reels / Video tanpa watermark kualitas jernih HD gratis dalam hitungan detik." />
  <link rel="stylesheet" href="/assets/css/skeuomorphic.css" />
</head>
<body>

  <main class="main-container">
    <!-- Header App -->
    <header class="app-header">
      <div class="logo-badge">SV</div>
      <div>
        <h1 class="app-title">Shopee Video Grabber</h1>
        <p class="app-subtitle">Download Reels & Video HD Tanpa Watermark</p>
      </div>
    </header>

    <!-- Card Input Form -->
    <section id="input-card" class="skeuo-card form-card">
      <form id="extractor-form">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="shopee-url" 
            class="skeuo-input" 
            placeholder="Tempel tautan Shopee Video / Reels..." 
            required 
            autocomplete="off"
          />
          <div class="input-actions">
            <button type="button" id="btn-clear" class="btn-clear" title="Hapus teks" style="display: none;">✕</button>
            <button type="button" id="btn-paste" class="btn-subtle" title="Tempel dari Clipboard">Tempel</button>
          </div>
        </div>
        <button type="submit" id="btn-extract" class="skeuo-button primary-btn">
          Ambil Media
        </button>
      </form>
      <div id="status-message" class="status-bar" style="display: none;"></div>
    </section>

    <!-- Result Card -->
    <section id="result-card" class="skeuo-card result-wrapper" style="display: none;">
      <div class="result-header">
        <span class="session-badge">✓ Sesi Ekstraksi Selesai</span>
        <h2 id="product-title" class="result-title"></h2>
      </div>

      <!-- Video Player Frame -->
      <div id="video-container" class="media-block">
        <div class="section-tag video-tag">Video HD (Tanpa Watermark)</div>
        <div class="video-frame">
          <video id="video-player" controls preload="metadata" playsinline></video>
        </div>
        <button id="btn-download-video" class="skeuo-button accent-btn">
          Download Video MP4
        </button>
      </div>

      <!-- Reset / Unduh Video Baru -->
      <div class="reset-action-block">
        <button id="btn-reset-flow" class="skeuo-button reset-btn">
          🔄 Unduh Video Lain / Mulai Ulang
        </button>
      </div>
    </section>
  </main>

  <script src="/assets/js/app.js" defer></script>
</body>
</html>
